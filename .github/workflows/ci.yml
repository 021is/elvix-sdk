name: CI

# The one definition of "this commit is releasable". Runs on every PR and push
# to main, and publish.yml CALLS it before publishing, so a tag can never ship
# something a PR would have rejected.
#
# The job is named `test` because that is the required status check on main's
# branch protection. Renaming it silently drops the requirement.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs. A hijacked tag (`v4`) cannot move the
      # pin; only an explicit bump here can. When upgrading, run
      # `gh api /repos/<repo>/git/refs/tags/<tag>` to fetch the SHA.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # Biome ratchet: errors AND warnings must equal .lint-baseline.json.
      # Plain `biome check` exits 0 on warnings, which is how 140 of them
      # passed unseen. Becomes `biome ci --error-on-warnings` at zero.
      - run: bun run lint:ci
      - run: bun run typecheck
      - run: bun run build
      # `bun run test` = vitest, the runner the suite is written for. Plain
      # `bun test` is Bun's own runner and ignores vitest.config.ts.
      - run: bun run test
