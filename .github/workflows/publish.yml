name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  # The exact PR gate (lint ratchet, typecheck, build, tests), not a second
  # copy of it. Publishing only happens if it passes.
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs. See the CI workflow for the upgrade rune.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The CDN must hold every key this release reads BEFORE the release is
      # public: 0.13 shipped the whole `buttons` namespace while the CDN had
      # none of it, and every non-English locale rendered English. Upload,
      # then read it back from elvix.is exactly as a host's browser would.
      - name: Sync catalogs to the translation CDN
        env:
          R2_I18N_ENDPOINT: ${{ secrets.R2_I18N_ENDPOINT }}
          R2_I18N_ACCESS_KEY_ID: ${{ secrets.R2_I18N_ACCESS_KEY_ID }}
          R2_I18N_SECRET_ACCESS_KEY: ${{ secrets.R2_I18N_SECRET_ACCESS_KEY }}
        run: node scripts/sync-catalogs.mjs
      - name: Verify the CDN serves every key
        run: node scripts/sync-catalogs.mjs --check
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
